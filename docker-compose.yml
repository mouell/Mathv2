version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mathv2
      POSTGRES_USER: mathv2
      POSTGRES_PASSWORD: mathv2_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathv2"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mathv2:mathv2_secret_2024@postgres:5432/mathv2
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      AI_ENGINE_URL: http://ai-engine:8001
      PORT: 3001
      UPLOAD_PATH: /uploads
    ports:
      - "3001:3001"
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UPLOAD_PATH: /uploads
      OCR_LANGUAGES: fra+eng
      DEFAULT_CONTROLLER: fanuc
    ports:
      - "8001:8001"
    volumes:
      - uploads:/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_AI_ENGINE_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads:
